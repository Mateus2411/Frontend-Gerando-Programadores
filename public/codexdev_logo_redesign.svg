<svg width="100%" viewBox="0 0 800 320" role="img" xmlns="http://www.w3.org/2000/svg" style="">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">CodexDev Logo</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Logo redesenhada do CodexDev com ícone hexagonal 3D e tipografia refinada</desc>

  <defs>
    <!-- Gradiente principal do hexágono -->
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="40%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D2B7A"/>
    </linearGradient>

    <!-- Gradiente face lateral esquerda -->
    <linearGradient id="hexSideL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A1E6A"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>

    <!-- Gradiente face lateral direita -->
    <linearGradient id="hexSideR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A4FC4"/>
      <stop offset="100%" stop-color="#0D2060"/>
    </linearGradient>

    <!-- Gradiente da seta -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#29B6F6"/>
      <stop offset="50%" stop-color="#81D4FA"/>
      <stop offset="100%" stop-color="#E0F7FA"/>
    </linearGradient>

    <!-- Glow azul claro -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Glow leve para seta -->
    <filter id="arrowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Gradiente texto Codex -->
    <linearGradient id="textDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A3A8F"/>
      <stop offset="100%" stop-color="#0D2060"/>
    </linearGradient>

    <!-- Gradiente texto Dev -->
    <linearGradient id="textLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#29B6F6"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>

    <!-- Clip para o hexágono -->
    <clipPath id="hexClip">
      <polygon points="130,30 195,68 195,145 130,183 65,145 65,68"/>
    </clipPath>
  </defs>

  <!-- ===================== ÍCONE HEXAGONAL 3D ===================== -->

  <!-- Sombra suave atrás -->
  <ellipse cx="130" cy="210" rx="65" ry="10" fill="rgba(13,32,96,0.18)" style="fill:rgba(13, 32, 96, 0.18);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Face inferior (base 3D) -->
  <polygon points="65,145 130,183 195,145 195,155 130,193 65,155" fill="#0A1852" style="fill:rgb(10, 24, 82);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Face lateral esquerda -->
  <polygon points="65,68 65,145 130,183 130,193 60,155 60,60" fill="url(#hexSideL)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Face lateral direita -->
  <polygon points="195,68 195,145 130,183 130,193 200,155 200,60" fill="url(#hexSideR)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Frente principal do hex (face frontal) -->
  <polygon points="130,30 195,68 195,145 130,183 65,145 65,68" fill="url(#hexGrad)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Borda refinada do hex -->
  <polygon points="130,30 195,68 195,145 130,183 65,145 65,68" fill="none" stroke="rgba(100,180,255,0.4)" stroke-width="1.2" style="fill:none;stroke:rgba(100, 180, 255, 0.4);color:rgb(255, 255, 255);stroke-width:1.2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Brilho interior sutil no hex -->
  <polygon points="130,38 188,73 188,140 130,175 72,140 72,73" fill="none" stroke="rgba(180,220,255,0.15)" stroke-width="1" style="fill:none;stroke:rgba(180, 220, 255, 0.15);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- ===================== CÓDIGO </> ===================== -->

  <!-- Símbolo < -->
  <text x="86" y="121" font-family="'Courier New', monospace" font-size="36" font-weight="700" fill="rgba(255,255,255,0.92)" text-anchor="middle" letter-spacing="-2" style="fill:rgba(255, 255, 255, 0.92);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Courier New&quot;, monospace;font-size:36px;font-weight:700;text-anchor:middle;dominant-baseline:auto">&lt;</text>

  <!-- Barra / -->
  <text x="130" y="123" font-family="'Courier New', monospace" font-size="32" font-weight="700" fill="rgba(200,240,255,0.85)" text-anchor="middle" style="fill:rgba(200, 240, 255, 0.85);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Courier New&quot;, monospace;font-size:32px;font-weight:700;text-anchor:middle;dominant-baseline:auto">/</text>

  <!-- Símbolo > -->
  <text x="174" y="121" font-family="'Courier New', monospace" font-size="36" font-weight="700" fill="rgba(255,255,255,0.92)" text-anchor="middle" style="fill:rgba(255, 255, 255, 0.92);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Courier New&quot;, monospace;font-size:36px;font-weight:700;text-anchor:middle;dominant-baseline:auto">&gt;</text>

  <!-- ===================== SETA DIAGONAL (com glow) ===================== -->

  <!-- Halo da seta -->
  <g filter="url(#arrowGlow)" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
    <polygon points="148,36 180,28 172,60 162,50 138,75 128,65 152,40" fill="rgba(130,210,255,0.35)" style="fill:rgba(130, 210, 255, 0.35);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  </g>

  <!-- Corpo da seta -->
  <polygon points="150,40 176,32 168,58 158,48 134,73 124,63 148,42" fill="url(#arrowGrad)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Borda da seta -->
  <polygon points="150,40 176,32 168,58 158,48 134,73 124,63 148,42" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="0.8" style="fill:none;stroke:rgba(255, 255, 255, 0.5);color:rgb(255, 255, 255);stroke-width:0.8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Brilho na ponta da seta -->
  <polygon points="155,33 176,32 168,53" fill="rgba(255,255,255,0.45)" style="fill:rgba(255, 255, 255, 0.45);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- ===================== TIPOGRAFIA ===================== -->

  <!-- "Codex" — peso pesado, azul escuro -->
  <text x="230" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="800" fill="url(#textDark)" letter-spacing="-1" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Segoe UI&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif;font-size:72px;font-weight:800;text-anchor:start;dominant-baseline:auto">Codex</text>

  <!-- "Dev" — mesmo tamanho, azul claro -->
  <text x="507" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="800" fill="url(#textLight)" letter-spacing="-1" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Segoe UI&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif;font-size:72px;font-weight:800;text-anchor:start;dominant-baseline:auto">Dev</text>

  <!-- Subtítulo — espacejado, cinza médio -->
  <text x="231" y="172" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#6C8DBF" letter-spacing="4" style="fill:rgb(108, 141, 191);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Segoe UI&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif;font-size:13.5px;font-weight:500;text-anchor:start;dominant-baseline:auto">ADVANCED CODE DEVELOPMENT</text>

  <!-- Linha separadora fina sob subtítulo -->
  <line x1="231" y1="182" x2="660" y2="182" stroke="rgba(41,182,246,0.18)" stroke-width="0.8" style="fill:rgb(0, 0, 0);stroke:rgba(41, 182, 246, 0.18);color:rgb(255, 255, 255);stroke-width:0.8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

</svg>